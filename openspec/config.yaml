schema: spec-driven

context: |
  Project: webcmp — Centro Meteorológico Provincial Camagüey. Public weather
           portal, admin dashboard and REST API for third parties.
  Stack: Django 5.2, DRF 3.17, drf-spectacular, Python 3.14. Exact versions in
         requirements/base.txt.
  Architecture: Django monolith. Apps live under apps/ (api, user_auth, core,
                dashboard, commercial, meteo, home, publications); config/ holds
                settings, root urls, wsgi/asgi and Huey.
  UI: Tabler (Bootstrap 5) through Django Templates, formatted with djlint
      (2-space indent). Vanilla JS, no bundler and no build step.
  Persistence: PostgreSQL in all three profiles (dev, test, prod). Async: Huey.
  Testing: Django unittest via `python manage.py test apps.<app>`; no pytest.
  Lint/Format: ruff + ruff-format; djlint for templates; pre-commit hooks.
  CI: GitHub Actions — per-app tests on PR (dorny/paths-filter), full suite on
      push to main, plus lint, security (pip-audit + makemigrations --check),
      templates and pre-commit jobs.

rules:
  proposal:
    - Include rollback plan for risky changes
  specs:
    - Use Given/When/Then for scenarios
    - Use RFC 2119 keywords (MUST, SHALL, SHOULD, MAY)
  design:
    - Document architecture decisions with rationale
  tasks:
    - Group by phase, use hierarchical numbering
    - Keep tasks completable in one session
  apply:
    guidelines:
      - Follow existing code patterns (apps live in apps/, import as from apps.<app>...)
      - Respect default_permissions=() + 4 custom (view/add/change/delete) on models
      - Use uuid kwarg (not pk) in URLs of UUIDField models
      - Apply FileHandlerMixin + SoftDeleteModel per project conventions
    tdd: true
    test_command: "python manage.py test apps.<app>"
  verify:
    test_command: "python manage.py test"
    build_command: "python manage.py check"
    coverage_threshold: 0
  archive:
    - Warn before merging destructive deltas

testing:
  strict_tdd: true
  runner: django_unittest
  test_command_selective: "python manage.py test apps.<app>"
  test_command_full: "python manage.py test"
  pytest: false
  coverage_tool: none
  coverage_threshold: 0
  linter: ruff
  formatter: ruff-format
  template_linter: djlint
  type_checker: none
  precommit_hooks:
    - ruff (--fix)
    - ruff-format
    - detect-secrets (baseline .secrets.baseline)
    - djlint-django
    - djlint-reformat-django
    - pre-commit-hooks: check-merge-conflict, end-of-file-fixer, trailing-whitespace
  ci:
    pr: per-app tests via dorny/paths-filter (apps.<app>)
    push_main: full suite (python manage.py test)
    extra_jobs: [lint, security (pip-audit + makemigrations --check), templates, precommit]
  layers:
    - unit: apps/*/tests/test_*.py (Django TestCase)
    - integration: apps/api/tests/test_api.py (DRF APITestCase)
  gotchas:
    - "Django is pinned to 5.2 in requirements/base.txt; do not assume 4.x APIs."
    - "App test labels must be the full dotted path (apps.meteo); the short label does not resolve in Django 5.2+."
    - "Migrations are versioned: commit makemigrations output in the same PR."
    - "Without PRODUCTION in the environment, manage.py uses the testing profile, not dev."
    - "pre-commit hooks download from PyPI on first run; use `pre-commit install --install-hooks`."

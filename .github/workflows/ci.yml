name: CI

on:
  # `dev` es la rama de integración: cada feature entra ahí por PR y `main`
  # solo recibe lo que ya está verde en `dev`.
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

# El runner va fijado a Ubuntu 26.04 porque es el SO de produccion, no por
# novedad: `install.sh` exige Python 3.14 (PEP 758 en scripts/generate_env.py) y
# 26.04 lo trae de fabrica mientras 24.04 trae 3.12. Validar `check --deploy` en
# una imagen distinta a la del servidor da un verde que no significa nada.
#
# Fijado y no `ubuntu-latest` porque ese label migra cuando GitHub lo decide: con
# el pin, cambiar el default no mueve el CI por sorpresa. Mismo criterio en todos
# los workflows.
jobs:
  detect:
    name: Detect affected apps
    runs-on: ubuntu-26.04
    outputs:
      meteo: ${{ steps.paths.outputs.meteo }}
      api: ${{ steps.paths.outputs.api }}
      user_auth: ${{ steps.paths.outputs.user_auth }}
      core: ${{ steps.paths.outputs.core }}
      dashboard: ${{ steps.paths.outputs.dashboard }}
      commercial: ${{ steps.paths.outputs.commercial }}
      home: ${{ steps.paths.outputs.home }}
      publications: ${{ steps.paths.outputs.publications }}
      full: ${{ steps.paths.outputs.full }}
    steps:
      - uses: actions/checkout@v7

      - uses: dorny/paths-filter@v4
        id: paths
        with:
          filters: |
            meteo: 'apps/meteo/**'
            api: 'apps/api/**'
            user_auth: 'apps/user_auth/**'
            core: 'apps/core/**'
            dashboard: 'apps/dashboard/**'
            commercial: 'apps/commercial/**'
            home: 'apps/home/**'
            publications: 'apps/publications/**'
            full:
              - 'config/**'
              - 'manage.py'
              - 'requirements/**'
              - 'pyproject.toml'
              - '.github/**'
              - 'templates/**'
              - 'static/**'

  test:
    name: Tests (Django)
    needs: detect
    runs-on: ubuntu-26.04
    env:
      DB_ENGINE: postgresql
      DB_NAME: webcmp
      DB_USER: webcmp
      DB_PASS: ci_placeholder_not_a_real_password  # pragma: allowlist secret
      DB_HOST: localhost
      DB_PORT: "5432"
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: webcmp
          POSTGRES_USER: webcmp
          POSTGRES_PASSWORD: ci_placeholder_not_a_real_password  # pragma: allowlist secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip

      - name: Install system dependencies (pycairo)
        run: sudo apt-get update && sudo apt-get install -y libcairo2-dev

      - name: Install dependencies
        run: pip install -r requirements/test.txt

      - name: Django system check
        run: python manage.py check

      - name: Generate and apply migrations
        run: |
          python manage.py makemigrations
          python manage.py migrate

      - name: Run affected app tests (PR)
        if: github.event_name == 'pull_request' && needs.detect.outputs.full == 'false'
        run: |
          LABELS=""
          [ "${{ needs.detect.outputs.meteo }}" = "true" ] && LABELS="$LABELS apps.meteo"
          [ "${{ needs.detect.outputs.api }}" = "true" ] && LABELS="$LABELS apps.api"
          [ "${{ needs.detect.outputs.user_auth }}" = "true" ] && LABELS="$LABELS apps.user_auth"
          [ "${{ needs.detect.outputs.core }}" = "true" ] && LABELS="$LABELS apps.core"
          [ "${{ needs.detect.outputs.dashboard }}" = "true" ] && LABELS="$LABELS apps.dashboard"
          [ "${{ needs.detect.outputs.commercial }}" = "true" ] && LABELS="$LABELS apps.commercial"
          [ "${{ needs.detect.outputs.home }}" = "true" ] && LABELS="$LABELS apps.home"
          [ "${{ needs.detect.outputs.publications }}" = "true" ] && LABELS="$LABELS apps.publications"
          if [ -z "$LABELS" ]; then
            echo "No se detectaron apps afectadas; se corre la suite completa como seguridad."
            python manage.py test
          else
            echo "Apps afectadas:$LABELS"
            python manage.py test $LABELS
          fi

      - name: Run full test suite (push to main)
        if: github.event_name == 'push' || needs.detect.outputs.full == 'true'
        run: python manage.py test

  deploy-check:
    name: Deploy check (check --deploy)
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip

      - name: Install system dependencies (pycairo)
        run: sudo apt-get update && sudo apt-get install -y libcairo2-dev
      - name: Install dependencies
        run: pip install -r requirements/prod.txt
      - name: Generate throwaway Fernet pair
        run: |
          python scripts/generate_env.py --development --env-file "$RUNNER_TEMP/.env"
          grep -E '^(SECRET_KEY|ENCRYPTION_KEY)=' "$RUNNER_TEMP/.env" >> "$GITHUB_ENV"
          rm -f "$RUNNER_TEMP/.env"

      - name: Run deployment checks (production profile)
        env:
          PRODUCTION: "1"
          SITE_URL: https://www.meteocamaguey.cu/
          DB_ENGINE: postgresql
          DB_NAME: webcmp
          DB_USER: webcmp
          DB_HOST: localhost
          DB_PASS: ci_placeholder_not_a_real_password  # pragma: allowlist secret
        run: python manage.py check --deploy --fail-level WARNING

  lint:
    name: Lint (Ruff)
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip

      - name: Install system dependencies (pycairo)
        run: sudo apt-get update && sudo apt-get install -y libcairo2-dev

      - name: Install dev dependencies
        run: pip install -r requirements/dev.txt

      - name: Run Ruff
        run: ruff check .

  security:
    name: Security (pip-audit + migrations)
    runs-on: ubuntu-26.04
    env:
      DB_ENGINE: postgresql
      DB_NAME: webcmp
      DB_USER: webcmp
      DB_PASS: ci_placeholder_not_a_real_password  # pragma: allowlist secret
      DB_HOST: localhost
      DB_PORT: "5432"
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: webcmp
          POSTGRES_USER: webcmp
          POSTGRES_PASSWORD: ci_placeholder_not_a_real_password  # pragma: allowlist secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip

      - name: Install system dependencies (pycairo)
        run: sudo apt-get update && sudo apt-get install -y libcairo2-dev

      - name: Install dependencies
        run: pip install -r requirements/dev.txt

      - name: Audit Python dependencies
        run: |
          pip-audit -r requirements/base.txt --ignore-vuln PYSEC-2026-2860
          pip-audit -r requirements/prod.txt --ignore-vuln PYSEC-2026-2860

      - name: Generate and apply migrations
        run: |
          python manage.py makemigrations
          python manage.py migrate

  templates:
    name: Templates (djlint)
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip

      - name: Install system dependencies (pycairo)
        run: sudo apt-get update && sudo apt-get install -y libcairo2-dev

      - name: Install dev dependencies
        run: pip install -r requirements/dev.txt

      - name: Check template formatting
        run: djlint . --reformat --check

      - name: Lint templates
        run: djlint . --lint

  precommit:
    name: Pre-commit hooks
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip

      - name: Install system dependencies (pycairo)
        run: sudo apt-get update && sudo apt-get install -y libcairo2-dev

      - name: Install dev dependencies
        run: pip install -r requirements/dev.txt

      - name: Run pre-commit hooks
        run: pre-commit run --all-files

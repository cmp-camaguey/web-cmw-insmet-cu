name: Security scan (Bandit)

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]
  schedule:
    - cron: "42 18 * * 6"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  bandit:
    name: Bandit SAST
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip

      - name: Install system dependencies (pycairo)
        run: sudo apt-get update && sudo apt-get install -y libcairo2-dev

      - name: Install dev dependencies
        run: pip install -r requirements/dev.txt

      - name: Run Bandit
        run: bandit -r apps config manage.py -ll -x "*test*.py,*migrations*"

  # Este workflow es solo Bandit. El gate `check --deploy` no debe volver aquí:
  # el dispatcher elige perfil de settings según `PRODUCTION`, así que sin
  # `PRODUCTION=1` en el entorno comprobaría el perfil `testing` y no el que se
  # despliega. Vive en ci.yml como `deploy-check`, bajo `PRODUCTION=1` y con su
  # propio par Fernet.
